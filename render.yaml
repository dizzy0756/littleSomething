# Render Blueprint — deploys the backend (apps/api) as a Web Service.
# Must live at the REPO ROOT: Render's Blueprint only reads render.yaml from the
# repository root, not from subfolders.
#
# Secrets marked sync:false are entered once in the Render dashboard.
#
# NOTE: no rootDir. Install happens from the repo ROOT so npm workspaces can
# symlink the private @little-something/shared package into apps/api. Building
# inside apps/api alone fails with E404 because that package is not published to npm.

services:
  - type: web
    name: little-something-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    # No rootDir — install from the repo root.
    buildCommand: npm install
    startCommand: npm start --workspace apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon pooled connection string — entered in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: PAYMENT_AMOUNT
        value: "9900"
      - key: PAYMENT_CURRENCY
        value: INR
      - key: PRIVATE_LINK_EXPIRY_DAYS
        value: "7"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
