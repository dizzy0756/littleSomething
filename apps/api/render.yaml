# Render Blueprint — deploys the backend (apps/api) + managed PostgreSQL.
# Push this repo to GitHub and connect it in the Render dashboard ("Blueprint").
# Secrets marked sync:false are entered once in the Render dashboard.

services:
  - type: web
    name: little-something-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: little-something-db
          property: connectionString
      # Use the pooled connection string for better concurrency:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: little-something-db
      #     property: connectionStringWithPooler
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PAYMENT_AMOUNT
        value: "9900"
      - key: PAYMENT_CURRENCY
        value: INR
      - key: PRIVATE_LINK_EXPIRY_DAYS
        value: "7"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: little-something-db
    databaseName: little_something
    plan: free
