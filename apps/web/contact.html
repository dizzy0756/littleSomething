<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contact — LittleSomething</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="marketing.css">
        <link rel="stylesheet" href="support.css">
    </head>
    <body>
        <header class="nav">
            <a class="brand" href="index.html">little<span>Something</span><i>♥</i></a>
            <a href="index.html" class="text-link">← Home</a>
        </header>
        <main class="legal">
            <p class="eyebrow">We’re listening</p>
            <h1>Get in touch.</h1>
            <p class="legal-note">Questions, ideas or a little something gone wrong — reach us any way you like.</p>

            <div class="contact-channels">
                <div class="contact-channel">
                    <span class="contact-icon">✉</span>
                    <h3>Email</h3>
                    <p>Write to us anytime at <a href="mailto:pritamlaiz007@gmail.com">pritamlaiz007@gmail.com</a>.</p>
                </div>
                <div class="contact-channel">
                    <span class="contact-icon">☏</span>
                    <h3>Phone / WhatsApp</h3>
                    <p>Prefer to talk? Call or message <a href="tel:+917629949838">+91 7629949838</a>.</p>
                </div>
            </div>

            <h2>Send a message</h2>
            <form class="contact-form" action="mailto:pritamlaiz007@gmail.com" method="post" enctype="text/plain">
                <label>Your name<input type="text" name="name" placeholder="Your name" required></label>
                <label>Your email<input type="email" name="email" placeholder="you@example.com" required></label>
                <label>Message<textarea name="message" rows="5" placeholder="How can we help?" required></textarea></label>
                <button class="button" type="submit">Send message <span>→</span></button>
            </form>
        </main>
    </body>
</html>
