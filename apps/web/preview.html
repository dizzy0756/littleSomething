<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview — Little Something For You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="marketing.css">
  <style>
    .preview-frame-wrap {
      width: 100%;
      height: calc(100vh - 80px);
      border: none;
      background: #fff;
    }
    #previewFrame {
      width: 100%;
      height: 100%;
      border: none;
    }
    .preview-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: #fff;
      border-bottom: 1px solid #e8d9db;
    }
    .preview-nav a {
      font-weight: 700;
      color: #3e2840;
      text-decoration: none;
    }
    .preview-nav .back {
      color: #725d70;
    }
  </style>
</head>
<body>
  <nav class="preview-nav">
    <a href="templates.html" class="back">← Back to templates</a>
    <a href="builder.html">Make one like this →</a>
  </nav>
  <div class="preview-frame-wrap">
    <iframe id="previewFrame" title="Template preview"></iframe>
  </div>

  <script type="module" src="engine.js"></script>
  <script type="module">
    (async function () {
      var params = new URLSearchParams(window.location.search);
      var templateId = params.get("template") || "playful-love-journey";

      try {
        await TemplateEngine.load(templateId);
        var template = TemplateEngine.get(templateId);
        if (!template) throw new Error("Template not found: " + templateId);

        var data = deepClone(template.defaultData);
        var html = TemplateEngine.buildSiteHTML(templateId, data, { cssHref: template.getAssetPath("template.css") });
        document.getElementById("previewFrame").srcdoc = html;
      } catch (e) {
        console.error(e);
        document.getElementById("previewFrame").srcdoc =
          "<html><body style='font-family:sans-serif;padding:2rem;text-align:center;'>" +
          "<h1>Template not found</h1>" +
          "<p>The requested template could not be loaded.</p>" +
          "<a href='templates.html'>Choose a template</a>" +
          "</body></html>";
      }

      function deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
      }
    })();
  </script>
</body>
</html>
