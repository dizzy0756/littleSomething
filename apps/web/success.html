<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your surprise is ready — LittleSomething</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="marketing.css">
  <script src="/src/config.js"></script>
  <style>
    .success-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .success-card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 48px 32px;
      box-shadow: 0 20px 55px rgba(99,55,82,.12);
    }
    .success-heart {
      font-size: 4rem;
      color: #f3698b;
      display: block;
      margin-bottom: 16px;
    }
    .success-card h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 12px;
    }
    .success-card p {
      color: #725d70;
      margin-bottom: 24px;
    }
    .link-box {
      background: #fff6f2;
      border: 1px dashed #e8d9db;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.95rem;
      color: #5a3040;
    }
    .link-box a {
      color: #c55373;
      font-weight: 700;
      text-decoration: none;
    }
    .success-hint {
      font-size: 0.85rem;
      color: #9a8697;
      margin: 16px 0 0;
      line-height: 1.5;
    }
    .success-hint .hint-link {
      color: #c55373;
      font-weight: 600;
      text-decoration: none;
    }
    .success-hint .hint-link:hover {
      text-decoration: underline;
    }
    .copy-btn {
      margin-top: 12px;
    }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #ffe0e7;
      border-radius: 50%;
      border-top-color: #f3698b;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header class="create-nav">
    <a class="brand" href="index.html">little<span>Something</span><i>♥</i></a>
  </header>
  <main class="success-page">
    <div class="success-card">
      <span class="success-heart">♥</span>
      <h1>Your surprise is ready</h1>
      <p id="statusText"><span class="loader"></span> Confirming your payment...</p>
      <div id="linkArea" hidden>
        <div class="link-box">
          <a id="publicUrl" class="link-url" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <button class="button copy-btn" id="copyBtn">Copy private link</button>
        <br><br>
        <a href="builder.html" class="text-link">← Back to builder</a><br><br>
        <a href="dashboard.html" class="text-link">Go to your dashboard →</a>
        <p class="success-hint">Tip: You can review, manage, and edit your link anytime from your <a href="dashboard.html" class="hint-link">dashboard</a>.</p>
      </div>
    </div>
  </main>
  <script type="module">
    (function () {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get("slug");
      var statusEl = document.getElementById("statusText");
      var linkArea = document.getElementById("linkArea");
      var publicUrlEl = document.getElementById("publicUrl");
      var copyBtn = document.getElementById("copyBtn");

      if (!slug) {
        statusEl.textContent = "No link provided. Please go back to the builder.";
        return;
      }

      var baseUrl = window.API_BASE || window.location.origin;
      var fullUrl = baseUrl.replace(/\/$/, "") + "/s/" + slug;
      publicUrlEl.textContent = fullUrl;
      publicUrlEl.href = fullUrl;

      var token = localStorage.getItem("littleSomething_token");
      if (token) {
        fetch((window.API_BASE || "") + "/api/links", {
          headers: { "Authorization": "Bearer " + token },
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            var found = data.links && data.links.some(function (l) { return l.slug === slug; });
            if (found) {
              statusEl.textContent = "Payment confirmed — your private link is ready.";
            } else {
              statusEl.textContent = "Link generated. If you were charged, please contact support.";
            }
            linkArea.hidden = false;
          })
          .catch(function () {
            statusEl.textContent = "Link generated. If you were charged, please contact support.";
            linkArea.hidden = false;
          });
      } else {
        statusEl.textContent = "Your private link is ready.";
        linkArea.hidden = false;
      }

      copyBtn.addEventListener("click", function () {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(fullUrl);
          copyBtn.textContent = "Copied!";
          setTimeout(function () { copyBtn.textContent = "Copy private link"; }, 2000);
        }
      });
    })();
  </script>
</body>
</html>
