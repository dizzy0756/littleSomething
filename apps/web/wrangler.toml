name = "littlesomethingweb"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

# Runtime var for functions/[[path]].js. Dashboard vars are IGNORED when this
# file exists, so the API origin must be declared here.
[vars]
API_BASE_URL = "https://little-something-api.onrender.com"

[env.preview.vars]
API_BASE_URL = "https://little-something-api.onrender.com"

# Public build-time vars (VITE_*) are intentionally LEFT UNSET so the browser
# talks only to the Pages origin (same-origin, zero CORS). The Razorpay key comes
# from the API at runtime, not from a build variable.
