<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password — LittleSomething</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="marketing.css">
  <script type="module" src="/src/config.js"></script>
  <style>
    .reset-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .reset-card {
      max-width: 440px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 44px 32px;
      box-shadow: 0 20px 55px rgba(99,55,82,.12);
      text-align: center;
    }
    .reset-card h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin-bottom: 8px;
    }
    .reset-card p.sub { color: #725d70; margin-bottom: 24px; }
    .reset-card .field { text-align: left; margin: 0.8rem 0; }
    .reset-card .field span { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #5a4654; }
    .reset-card .field input {
      width: 100%; padding: 12px 14px; border: 1px solid #e7d7df; border-radius: 12px;
      font-size: 1rem; font-family: inherit;
    }
    .reset-card .field input:focus { outline: 2px solid #f3698b; border-color: #f3698b; }
    .reset-msg { margin-top: 16px; font-size: 0.9rem; padding: 10px 12px; border-radius: 10px; display: none; }
    .reset-msg.show { display: block; }
    .reset-msg.err { background: #fff3f6; color: #a23b5c; }
    .reset-msg.ok { background: #eafaf0; color: #1f7a44; }
  </style>
</head>
<body>
  <header class="create-nav">
    <a class="brand" href="index.html">little<span>Something</span><i>♥</i></a>
  </header>
  <main class="reset-page">
    <div class="reset-card">
      <h1>Reset your password</h1>
      <p class="sub">Choose a new password for your LittleSomething account.</p>

      <form id="resetForm">
        <div class="field">
          <span>New password</span>
          <input type="password" id="newPassword" required minlength="8" />
        </div>
        <div class="field">
          <span>Confirm new password</span>
          <input type="password" id="confirmPassword" required minlength="8" />
        </div>
        <button class="button" type="submit" id="submitBtn" style="width:100%; margin-top:0.4rem;">Update password</button>
      </form>

      <p id="resetMsg" class="reset-msg"></p>
      <a href="builder.html" class="button" id="backToLogin" style="display:none; margin-top:18px;">Back to builder</a>
    </div>
  </main>
  <script type="module" src="reset-password.js"></script>
</body>
</html>
